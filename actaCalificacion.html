<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acta de Calificación — Colegio Enrique de Ossó</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css?v=1.0.8">
  <style>
    .layout__conteiner { max-width: 1800px; }
    .layout--full { grid-template-columns: 1fr; }
    .layout__section--full { width: 100%; max-width: 100%; margin: 0 0 20px 0; padding: 24px; }

    .barra { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .barra .form__group { margin: 0; flex: 0 1 230px; }
    .btn-accion {
      padding: 10px 20px; font-weight: 600; border-radius: var(--radius-sm);
      border: none; cursor: pointer; background: var(--primary); color: var(--white);
      font-family: var(--font-body); font-size: 0.9rem;
    }
    .btn-accion--suave {
      background: var(--slate-100); color: var(--primary-dark);
      border: 1px solid var(--slate-200);
    }

    .acta__encabezado {
      text-align: center; border-bottom: 3px solid var(--primary);
      padding-bottom: 12px; margin-bottom: 16px;
    }
    .acta__titulo {
      font-family: var(--font-heading); color: var(--primary-dark);
      font-size: 1.2rem; font-weight: 700;
    }
    .acta__sub { color: var(--gray-700); font-size: 0.9rem; margin-top: 3px; }

    .tabla-scroll {
      overflow: auto; max-height: 68vh;
      border: 1px solid var(--slate-300); border-radius: var(--radius-sm);
      background: var(--white);
    }
    table.acta { border-collapse: collapse; font-size: 0.78rem; width: 100%; }
    table.acta th, table.acta td {
      border: 1px solid var(--slate-300); padding: 5px 6px; text-align: center;
      white-space: nowrap;
    }
    table.acta thead th {
      position: sticky; z-index: 3;
      background: var(--gradient-primary); color: var(--white);
      font-family: var(--font-heading); font-size: 0.66rem;
      text-transform: uppercase; letter-spacing: 0.2px;
    }
    /* La cabecera tiene DOS filas y cada una se pega a distinta altura. Con
       `top: 0` en las dos, la de CT/CL se pegaba arriba igual que la de
       asignaturas y se le encimaba al hacer scroll: los CL aparecian flotando
       sobre los nombres de las materias. La segunda fila arranca donde termina
       la primera, asi que su `top` es la altura de la primera. */
    table.acta thead tr:first-child th { top: 0; }
    table.acta thead tr:nth-child(2) th { top: 165px; z-index: 3; }
    /* Los nombres de asignatura son largos: se giran para que la tabla quepa.
       Su altura es la que fija el `top` de la fila de abajo: si se cambia una
       hay que cambiar la otra. */
    table.acta thead th.materia {
      writing-mode: vertical-rl; transform: rotate(180deg);
      height: 165px; vertical-align: bottom; padding: 6px 3px;
      font-size: 0.64rem; letter-spacing: 0;
    }
    table.acta th.col-nombre, table.acta td.col-nombre {
      text-align: left; min-width: 215px; max-width: 215px;
      white-space: normal; position: sticky; left: 34px;
      background: var(--white); z-index: 2;
    }
    table.acta th.col-num, table.acta td.col-num {
      width: 34px; position: sticky; left: 0; background: var(--white); z-index: 2;
    }
    table.acta thead th.col-nombre, table.acta thead th.col-num {
      z-index: 4; background: var(--primary-dark); writing-mode: horizontal-tb;
      transform: none; height: auto; vertical-align: middle;
    }
    /* Las columnas fijas de la izquierda tapan a las que pasan por debajo al
       hacer scroll horizontal; sin fondo propio se transparentan. */
    table.acta tbody td.col-num, table.acta tbody td.col-nombre {
      background: var(--white);
    }
    table.acta tbody tr:nth-child(even) td { background: var(--slate-50); }
    table.acta tbody tr:nth-child(even) td.col-nombre,
    table.acta tbody tr:nth-child(even) td.col-num { background: var(--slate-50); }
    .cual { font-weight: 700; }
    .cual-AA { color: #047857; } .cual-AS { color: #1D4ED8; }
    .cual-AF { color: #B45309; } .cual-AI { color: #B91C1C; }
    .vacio { color: var(--gray-400); }
    .col-resumen { background: rgba(93,60,166,0.06); font-weight: 600; }
    .reprueba { color: #B91C1C; font-weight: 700; }

    .nota-promedio {
      margin-top: 14px; padding: 12px 16px; font-size: 0.84rem; line-height: 1.6;
      background: #FEF3C7; border: 1px solid #FCD34D; color: #78350F;
      border-radius: var(--radius-sm);
    }
    .firmas {
      display: flex; justify-content: space-around; gap: 40px;
      margin-top: 44px; font-size: 0.84rem; text-align: center;
    }
    .firmas div { flex: 1; border-top: 1px solid var(--gray-700); padding-top: 6px; }

    @media print {
      .nav, .separador, .background, .no-imprimir { display: none !important; }
      .layout__conteiner { max-width: 100%; padding: 0; }
      .layout__section--full { padding: 0; box-shadow: none; border: none; background: #fff; }
      .tabla-scroll { max-height: none; overflow: visible; border: none; }
      table.acta { font-size: 0.6rem; }
      table.acta thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { size: landscape; }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <nav class="nav">
    <div class="nav__container">
      <button class="nav__button" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="nav__item"><span class="nav__title">Acta de Calificación</span></div>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#" id="logout-link"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="layout__conteiner">
    <div class="layout layout--full">
      <div style="width:100%;">

        <section class="layout__section layout__section--full no-imprimir">
          <div class="section">
            <div class="section__title">📄 Acta de Calificación</div>
            <p style="color:var(--gray-600); font-size:0.9rem; margin-bottom:16px;">
              Consolidado del grupo completo: una fila por estudiante y una columna por
              asignatura, con su nota (CT) y su letra (CL).
            </p>
            <div class="barra">
              <div class="form__group">
                <label class="form__label" for="sel-grupo">Grupo</label>
                <select class="form__control" id="sel-grupo">
                  <option value="">Cargando grupos...</option>
                </select>
              </div>
              <div class="form__group">
                <label class="form__label" for="sel-corte">Periodo</label>
                <select class="form__control" id="sel-corte">
                  <option value="I">I Corte</option>
                  <option value="II">II Corte</option>
                  <option value="IS">I Semestre</option>
                  <option value="III">III Corte</option>
                  <option value="IV">IV Corte</option>
                  <option value="IIS">II Semestre</option>
                  <option value="NF">Nota Final</option>
                </select>
              </div>
              <button type="button" class="btn-accion" id="btn-generar">Generar</button>
              <button type="button" class="btn-accion btn-accion--suave" id="btn-imprimir">Imprimir</button>
              <button type="button" class="btn-accion btn-accion--suave" id="btn-mined">Descargar IC-MINED</button>
            </div>
          </div>
        </section>

        <section class="layout__section layout__section--full" id="seccion-acta" style="display:none;">
          <div class="section">
            <div class="acta__encabezado">
              <div class="acta__titulo">Colegio Enrique de Ossó</div>
              <div class="acta__titulo" style="font-size:1.05rem;">ACTA DE CALIFICACIÓN</div>
              <div class="acta__sub" id="acta-sub"></div>
            </div>
            <div class="tabla-scroll">
              <table class="acta" id="tabla-acta"></table>
            </div>
            <div class="nota-promedio" id="nota-promedio"></div>
            <div class="firmas">
              <div>Docente guía</div>
              <div>Dirección</div>
              <div>Sello</div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script src="js/global.js?v=1.5.1"></script>
  <script src="js/scriptActa.js?v=1.2.0"></script>
</body>
</html>
