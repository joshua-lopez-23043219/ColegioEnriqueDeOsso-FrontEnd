<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis IA — Colegio Enrique de Ossó</title>
  <link rel="stylesheet" href="css/global.css?v=1.0.8">
  <style>
    .ia__container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .ia__intro { color: var(--gray-700, #444); font-size: 0.95rem; margin-bottom: 12px; }
    .ia__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chat-chip {
      background: var(--primary-glow, #ece8fb); color: var(--primary, #5D3CA6);
      border: none; border-radius: 999px; padding: 6px 14px; font-size: 0.82rem;
      cursor: pointer; font-weight: 600;
    }
    .chat-chip:hover { filter: brightness(0.95); }
    .chat-panel {
      background: #fff; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; height: 60vh; min-height: 360px; overflow: hidden;
    }
    .chat-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { display: flex; }
    .chat-msg--user { justify-content: flex-end; }
    .chat-msg--ai { justify-content: flex-start; }
    .chat-bubble {
      max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 0.92rem;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .chat-msg--user .chat-bubble { background: var(--primary, #5D3CA6); color: #fff; border-bottom-right-radius: 4px; }
    .chat-msg--ai .chat-bubble { background: var(--gray-100, #f1f0f5); color: #1f1f2e; border-bottom-left-radius: 4px; }
    .chat-bubble--pending { opacity: 0.7; font-style: italic; }
    .chat-note { font-size: 0.75rem; color: var(--gray-600, #777); text-align: center; }
    .chat-inputbar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--gray-200, #e6e4ee); align-items: flex-end; }
    .chat-input {
      flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 12px;
      border: 1px solid var(--gray-300, #d5d3e0); border-radius: 10px; font-family: inherit; font-size: 0.92rem;
    }
    .chat-tools { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--gray-700, #444); padding: 0 12px 10px; }
    .chat-tools input[type="date"] { padding: 4px 8px; border: 1px solid var(--gray-300, #d5d3e0); border-radius: 8px; }
    .chat-send {
      background: var(--primary, #5D3CA6); color: #fff; border: none; border-radius: 10px;
      padding: 0 20px; height: 44px; font-weight: 700; cursor: pointer;
    }
    .chat-send:disabled { opacity: 0.6; cursor: default; }
    @media screen and (max-width: 600px) {
      .chat-tools {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 0 12px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <nav class="nav">
    <button class="nav__button" onclick="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <span class="nav__title">Análisis IA</span>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="ia__container">
    <p class="ia__intro">
      Pregunte en lenguaje natural sobre el rendimiento académico. El análisis se
      construye con los datos reales del sistema (notas, asistencia, horarios y
      docentes). Las cifras son señales para investigar, no un veredicto.
    </p>

    <div class="ia__chips">
      <button type="button" class="chat-chip">¿Por qué bajaron las notas este periodo?</button>
      <button type="button" class="chat-chip">¿El horario de la tarde afecta el rendimiento?</button>
      <button type="button" class="chat-chip">¿Es problema del docente o de la asignatura?</button>
      <button type="button" class="chat-chip">¿Influye la asistencia en las notas?</button>
    </div>

    <div class="chat-panel">
      <div class="chat-messages" id="chat-messages"></div>

      <div class="chat-tools">
        <label for="chat-cutdate">Comparar antes/después de:</label>
        <input type="date" id="chat-cutdate">
        <span>(opcional, para cambios de horario)</span>
      </div>

      <div class="chat-inputbar">
        <textarea id="chat-input" class="chat-input" placeholder="Escriba su pregunta…" rows="1"></textarea>
        <button id="chat-send" class="chat-send" type="button">Enviar</button>
      </div>
    </div>
  </div>

  <script src="js/global.js?v=1.1.0"></script>
  <script src="js/scriptAnalisisIA.js?v=1.1.0"></script>
</body>
</html>
