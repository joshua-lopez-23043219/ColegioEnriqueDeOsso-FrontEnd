<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://backendcolegioenriquedeosso.sistemaacademico.com; connect-src 'self' https://backendcolegioenriquedeosso.sistemaacademico.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://backendcolegioenriquedeosso.sistemaacademico.com; script-src 'self' 'unsafe-inline';">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar Contraseña — Colegio Enrique de Ossó</title>

  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css?v=1.7.0" />

  <style>
    .pw__pantalla {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: var(--gradient-primary, var(--primary));
    }

    .pw__tarjeta {
      width: min(460px, 100%);
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: clamp(22px, 5vw, 36px);
      box-sizing: border-box;
    }

    .pw__escudo { display: block; margin: 0 auto 14px; width: 62px; height: 62px; object-fit: contain; }

    .pw__titulo {
      font-family: var(--font-heading);
      color: var(--primary-dark);
      text-align: center;
      font-size: clamp(1.15rem, 4vw, 1.4rem);
      margin: 0 0 8px;
    }

    .pw__motivo {
      font-size: 0.88rem;
      color: var(--gray-700);
      line-height: 1.55;
      text-align: center;
      margin: 0 0 20px;
    }

    .pw__quien {
      background: var(--gray-100);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--gray-700);
      margin-bottom: 18px;
      text-align: center;
    }

    .pw__campo { margin-bottom: 14px; }
    .pw__label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: var(--gray-800); }

    .pw__caja { position: relative; }
    .pw__caja input {
      width: 100%;
      padding: 11px 76px 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--slate-300, var(--gray-300));
      font-size: 0.95rem;
      box-sizing: border-box;
      font-family: var(--font-body);
    }
    .pw__ver {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--primary); font-size: 0.8rem; font-weight: 600;
      font-family: var(--font-body); text-decoration: underline; padding: 4px 6px;
    }

    /* Cada regla se marca sola mientras se escribe: sin esto el servidor las
       rechaza de una en una y no se sabe cuántas faltan. */
    .pw__reglas { list-style: none; padding: 0; margin: 10px 0 18px; font-size: 0.82rem; }
    .pw__reglas li { padding: 3px 0; color: var(--gray-600); display: flex; gap: 8px; align-items: flex-start; }
    .pw__reglas li::before { content: '○'; flex-shrink: 0; }
    .pw__reglas li.ok { color: var(--success, #10B981); font-weight: 600; }
    .pw__reglas li.ok::before { content: '●'; }

    .pw__boton {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--primary); color: var(--white);
      font-weight: 700; font-size: 0.98rem; cursor: pointer;
      font-family: var(--font-body);
    }
    .pw__boton:disabled { opacity: 0.55; cursor: not-allowed; }

    .pw__salir {
      display: block; width: 100%; margin-top: 14px; text-align: center;
      background: none; border: none; cursor: pointer;
      color: var(--gray-600); font-size: 0.84rem; text-decoration: underline;
      font-family: var(--font-body);
    }

    .pw__error {
      background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
      border-radius: var(--radius-md); padding: 10px 14px;
      font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px; display: none;
    }
  </style>
</head>

<body>
  <div class="pw__pantalla">
    <main class="pw__tarjeta">
      <img src="./images/LOGO.png?v=1.3.0" alt="Escudo del Colegio Enrique de Ossó" class="pw__escudo" />

      <h1 class="pw__titulo">Cambie su contraseña</h1>
      <p class="pw__motivo">
        La contraseña con la que entró se la generó el sistema, y la conoce
        quien se la entregó. Elija una suya para seguir.
      </p>

      <div class="pw__quien">
        Entrando como <strong id="pw_usuario">—</strong>
      </div>

      <div class="pw__error" id="pw_error"></div>

      <form id="pw_form" autocomplete="off">
        <div class="pw__campo">
          <label class="pw__label" for="pw_actual">Contraseña que le entregaron</label>
          <div class="pw__caja">
            <input type="password" id="pw_actual" autocomplete="current-password" required>
            <button type="button" class="pw__ver" data-para="pw_actual">Mostrar</button>
          </div>
        </div>

        <div class="pw__campo">
          <label class="pw__label" for="pw_nueva">Contraseña nueva</label>
          <div class="pw__caja">
            <input type="password" id="pw_nueva" autocomplete="new-password" required>
            <button type="button" class="pw__ver" data-para="pw_nueva">Mostrar</button>
          </div>
        </div>

        <ul class="pw__reglas" id="pw_reglas">
          <li data-regla="largo">Al menos 8 caracteres</li>
          <li data-regla="noNumerica">No solo números</li>
          <li data-regla="distinta">Distinta de la que le entregaron</li>
          <li data-regla="noUsuario">Que no sea su nombre de usuario</li>
        </ul>

        <div class="pw__campo">
          <label class="pw__label" for="pw_repetir">Repita la contraseña nueva</label>
          <div class="pw__caja">
            <input type="password" id="pw_repetir" autocomplete="new-password" required>
            <button type="button" class="pw__ver" data-para="pw_repetir">Mostrar</button>
          </div>
        </div>

        <button type="submit" class="pw__boton" id="pw_guardar">Guardar y continuar</button>
      </form>

      <button type="button" class="pw__salir" id="pw_salir">Salir sin cambiarla</button>
    </main>
  </div>

  <script src="js/global.js?v=1.8.0"></script>
  <script src="js/cambiarPassword.js?v=1.0.0"></script>
</body>

</html>
