<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://backendcolegioenriquedeosso.sistemaacademico.com; connect-src 'self' https://backendcolegioenriquedeosso.sistemaacademico.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://backendcolegioenriquedeosso.sistemaacademico.com; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Académica — Colegio Enrique de Ossó</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css?v=1.0.8">
</head>
<body>
  <div class="background"></div>

  <header class="header">
    <div class="header__content">
      <h1 class="header__title">Sistema Académico Colegio Enrique de Ossó</h1>
    </div>
  </header>
  <div class="separador"></div>

  <nav class="nav">
    <button class="nav__button" onclick="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <span class="nav__title">Gestión Académica</span>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <section class="section">
      <div class="section__items">
        <a href="registroAsistencia.html" class="section__item" id="card-ga-asistencia">
          <img src="./images/Asistencia.png" class="section__item-icon" alt="Asistencia">
          Asistencia
        </a>
        <a href="consolidadoAsistencia.html" class="section__item" id="card-ga-consolidado">
          <img src="./images/Asistencia.png" class="section__item-icon" alt="Consolidado de Asistencia">
          Consolidado Asistencia
        </a>
        <a href="registroNotas.html" class="section__item" id="card-ga-notas">
          <img src="./images/Notas.png" class="section__item-icon" alt="Nota">
          Nota
        </a>
        <a href="actaCalificacion.html" class="section__item" id="card-ga-acta">
          <img src="./images/Notas.png" class="section__item-icon" alt="Acta">
          Acta de Calificación
        </a>
        <a href="boletin.html" class="section__item" id="card-ga-boletin">
          <img src="./images/Notas.png" class="section__item-icon" alt="Boletín">
          Boletín
        </a>
        <a href="valoresActitudes.html" class="section__item" id="card-ga-valores">
          <img src="./images/Notas.png" class="section__item-icon" alt="Valores y Actitudes">
          Valores y Actitudes
        </a>
        <a href="registroHorario.html" class="section__item" id="card-ga-horario">
          <img src="./images/Horario.png" class="section__item-icon" alt="Horario">
          Horario
        </a>
        <a href="registroMatricula.html" class="section__item" id="card-ga-matricula">
          <img src="./images/Matricula.png" class="section__item-icon" alt="Matrícula">
          Matrícula
        </a>
        <a href="registroReingreso.html" class="section__item" id="card-ga-reingreso">
          <img src="./images/Matricula.png" class="section__item-icon" alt="Reingreso">
          Reingreso
        </a>
        <a href="confirmarMatricula.html" class="section__item" id="card-ga-confirmar-matricula">
          <img src="./images/Matricula.png" class="section__item-icon" alt="Habilitar Matrícula">
          Habilitar Matrícula
        </a>
      </div>
    </section>
  </div>

  <script src="js/global.js?v=1.6.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const role = localStorage.getItem('user_role');
      
      const mostrar = (ids) => ids.forEach(id => {
        const card = document.getElementById(id);
        if (card) card.style.display = 'flex';
      });

      document.getElementById('card-ga-asistencia').style.display = 'none';
      document.getElementById('card-ga-consolidado').style.display = 'none';
      document.getElementById('card-ga-notas').style.display = 'none';
      document.getElementById('card-ga-valores').style.display = 'none';
      document.getElementById('card-ga-boletin').style.display = 'none';
      document.getElementById('card-ga-acta').style.display = 'none';
      document.getElementById('card-ga-horario').style.display = 'none';
      document.getElementById('card-ga-matricula').style.display = 'none';
      document.getElementById('card-ga-reingreso').style.display = 'none';
      document.getElementById('card-ga-confirmar-matricula').style.display = 'none';

      if (role === 'DIRECTOR' || role === 'ADMINISTRADOR') {
        mostrar(['card-ga-asistencia', 'card-ga-consolidado', 'card-ga-notas',
                 'card-ga-valores', 'card-ga-boletin', 'card-ga-acta',
                 'card-ga-horario', 'card-ga-matricula', 'card-ga-reingreso',
                 'card-ga-confirmar-matricula']);
      } else if (role === 'DOCENTE') {
        // El consolidado es de toda la secundaria: un docente solo puede ver
        // sus propios grupos, así que no se le muestra (el backend también
        // se lo rechaza).
        mostrar(['card-ga-asistencia', 'card-ga-notas', 'card-ga-valores',
                 'card-ga-boletin', 'card-ga-acta']);
      } else if (role === 'ADMINISTRACION') {
        mostrar(['card-ga-consolidado', 'card-ga-horario', 'card-ga-matricula',
                 'card-ga-reingreso', 'card-ga-confirmar-matricula']);
      } else if (role === 'COORDINADOR') {
        mostrar(['card-ga-consolidado']);
      }
    });
  </script>
</body>
</html>
