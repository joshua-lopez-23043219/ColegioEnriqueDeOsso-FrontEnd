<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios y Credenciales — Colegio Enrique de Ossó</title>
  <link rel="stylesheet" href="css/global.css?v=1.3.5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 1.25rem;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(62, 143, 214, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .stat-info h4 {
      font-size: 0.85rem;
      color: var(--slate-600);
      margin-bottom: 2px;
    }
    .stat-info span {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .table-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .role-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-block;
      text-transform: uppercase;
    }
    .badge-admin { background: #FEE2E2; color: #991B1B; }
    .badge-director { background: #FEF3C7; color: #92400E; }
    .badge-coordinador { background: #E0E7FF; color: #3730A3; }
    .badge-docente { background: #D1FAE5; color: #065F46; }
    .badge-administracion { background: #E0F2FE; color: #075985; }
    .badge-estudiante { background: #F3E8FF; color: #6B21A8; }
    .badge-tutor { background: #F3F4F6; color: #374151; }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .users-table th, .users-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--slate-200);
      font-size: 0.92rem;
    }
    .users-table th {
      background: var(--slate-50);
      color: var(--slate-700);
      font-weight: 700;
    }
    .users-table tr:hover {
      background: rgba(62, 143, 214, 0.03);
    }
    .btn-action {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-reset { background: #FEF3C7; color: #92400E; }
    .btn-reset:hover { background: #FDE68A; }
    .btn-toggle-on { background: #D1FAE5; color: #065F46; }
    .btn-toggle-off { background: #FEE2E2; color: #991B1B; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .modal-overlay.active {
      opacity: 1; pointer-events: auto; visibility: visible;
    }
    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 500px;
      width: 90%;
      box-shadow: var(--shadow-xl);
      position: relative;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <header class="header">
    <div class="header__content">
      <img src="./images/LOGO.png?v=1.3.5" alt="Logo Colegio Enrique de Ossó" class="header__content-imagen" style="border-radius: 50%; width: 44px; height: 44px;">
      <h1 class="header__title">Colegio Enrique de Ossó</h1>
    </div>
  </header>
  <div class="separador"></div>

  <nav class="nav">
    <button class="nav__button" onclick="window.location.href='index.html'">
      <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
    </button>
    <span class="nav__title">Gestión de Usuarios y Credenciales</span>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#" id="logout-link"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-container">
    <!-- Stat Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="ri-user-settings-fill"></i></div>
        <div class="stat-info">
          <h4>Total Cuentas</h4>
          <span id="stat-total">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(220, 38, 38, 0.1); color: #DC2626;"><i class="ri-shield-user-fill"></i></div>
        <div class="stat-info">
          <h4>Administración</h4>
          <span id="stat-admin">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(79, 70, 229, 0.1); color: #4F46E5;"><i class="ri-award-fill"></i></div>
        <div class="stat-info">
          <h4>Coordinadores</h4>
          <span id="stat-coord">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10B981;"><i class="ri-user-star-fill"></i></div>
        <div class="stat-info">
          <h4>Docentes</h4>
          <span id="stat-docente">0</span>
        </div>
      </div>
    </div>

    <!-- User Management Table Card -->
    <div class="table-card">
      <div class="controls-row">
        <div class="filter-group">
          <label style="font-weight: 600; color: var(--slate-700);">Rol:</label>
          <select id="role-filter" style="padding: 8px 14px; border-radius: 10px; border: 1px solid var(--slate-300); font-size: 0.9rem;">
            <option value="">Todos los Roles</option>
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="DIRECTOR">Director</option>
            <option value="COORDINADOR">Coordinador Académico</option>
            <option value="DOCENTE">Docente</option>
            <option value="ADMINISTRACION">Administración</option>
            <option value="ESTUDIANTE">Estudiante</option>
          </select>

          <input type="text" id="search-input" placeholder="Buscar por usuario o nombre..." style="padding: 8px 14px; border-radius: 10px; border: 1px solid var(--slate-300); font-size: 0.9rem; min-width: 240px;">
        </div>

        <button type="button" id="open-create-modal" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <i class="ri-user-add-fill"></i> Crear Nueva Credencial
        </button>
      </div>

      <div style="overflow-x: auto;">
        <table class="users-table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Nombre Completo</th>
              <th>Rol</th>
              <th>Correo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--slate-500); padding: 2rem;">Cargando lista de usuarios...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Crear Credencial -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 style="color: var(--primary-dark); font-size: 1.25rem;">Crear Credencial de Acceso</h3>
        <i class="ri-close-line" id="close-create-modal" style="font-size: 1.5rem; cursor: pointer; color: var(--slate-400);"></i>
      </div>

      <form id="create-user-form">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Rol de la Cuenta</label>
          <select id="new-role" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
            <option value="COORDINADOR">Coordinador Académico</option>
            <option value="DOCENTE">Maestro / Docente</option>
            <option value="ADMINISTRACION">Personal de Administración</option>
            <option value="DIRECTOR">Director / Equipo Directivo</option>
            <option value="ADMINISTRADOR">Administrador del Sistema</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Nombre de Usuario</label>
          <input type="text" id="new-username" placeholder="Ej: coord.matematica / prof.garcia" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Nombre(s)</label>
            <input type="text" id="new-firstname" placeholder="Nombre" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
          </div>
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Apellido(s)</label>
            <input type="text" id="new-lastname" placeholder="Apellido" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Correo Electrónico (Opcional)</label>
          <input type="email" id="new-email" placeholder="usuario@colegioenriquedeosso.edu.ni" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem;">Contraseña (Dejar vacío para generar automáticamente)</label>
          <input type="text" id="new-password" placeholder="Contraseña personalizada u opcional" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-300);">
        </div>

        <button type="submit" style="width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem;">
          Guardar y Crear Credencial
        </button>
      </form>
    </div>
  </div>

  <script src="js/global.js?v=1.3.5"></script>
  <script>
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', () => {
      const role = (localStorage.getItem('user_role') || '').trim();
      const username = (localStorage.getItem('user_username') || '').trim().toLowerCase();
      const isAllowed = (role === 'ADMINISTRADOR' || role === 'ADMIN' || role === 'DIRECTOR' || role === 'ADMINISTRACION' || username === 'admin');

      if (!isAllowed) {
        showToast('Acceso no autorizado para este módulo', 'error');
        setTimeout(() => window.location.href = 'index.html', 1500);
        return;
      }

      loadUsers();

      document.getElementById('role-filter').addEventListener('change', filterAndRender);
      document.getElementById('search-input').addEventListener('input', filterAndRender);

      // Modal Handlers
      const createModal = document.getElementById('create-modal');
      document.getElementById('open-create-modal').addEventListener('click', () => {
        createModal.classList.add('active');
      });
      document.getElementById('close-create-modal').addEventListener('click', () => {
        createModal.classList.remove('active');
      });
      createModal.addEventListener('click', (e) => {
        if (e.target === createModal) createModal.classList.remove('active');
      });

      // Form submit
      document.getElementById('create-user-form').addEventListener('submit', handleCreateUser);

      // Logout handler
      const logoutBtn = document.getElementById('logout-link');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.clear();
          window.location.href = 'vistaPrinc.html';
        });
      }
    });

    function loadUsers() {
      fetch(getApiUrl('/apiUserCreate/list_users/'), {
        headers: getAuthHeaders()
      })
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {
          allUsers = data;
          updateStats();
          filterAndRender();
        } else {
          showToast(data.error || 'Error al cargar usuarios', 'error');
        }
      })
      .catch(err => {
        console.error(err);
        showToast('Error de conexión al cargar usuarios', 'error');
      });
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = allUsers.length;
      document.getElementById('stat-admin').innerText = allUsers.filter(u => ['ADMINISTRADOR', 'ADMINISTRACION', 'DIRECTOR'].includes(u.role)).length;
      document.getElementById('stat-coord').innerText = allUsers.filter(u => u.role === 'COORDINADOR').length;
      document.getElementById('stat-docente').innerText = allUsers.filter(u => u.role === 'DOCENTE').length;
    }

    function filterAndRender() {
      const roleVal = document.getElementById('role-filter').value;
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allUsers.filter(u => {
        const matchRole = !roleVal || u.role === roleVal;
        const matchSearch = !searchVal || 
          u.username.toLowerCase().includes(searchVal) || 
          u.name.toLowerCase().includes(searchVal) || 
          (u.email && u.email.toLowerCase().includes(searchVal));
        return matchRole && matchSearch;
      });

      renderTable(filtered);
    }

    function renderTable(users) {
      const tbody = document.getElementById('users-tbody');
      if (!users.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--slate-500); padding: 2rem;">No se encontraron registros.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        const badgeClass = `badge-${u.role.toLowerCase()}`;
        const activeText = u.is_active ? '<span style="color: #10B981; font-weight:600;">Activo</span>' : '<span style="color: #EF4444; font-weight:600;">Inactivo</span>';
        const toggleBtnClass = u.is_active ? 'btn-toggle-off' : 'btn-toggle-on';
        const toggleBtnText = u.is_active ? 'Desactivar' : 'Activar';

        return `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td>${u.name}</td>
            <td><span class="role-badge ${badgeClass}">${u.role_display || u.role}</span></td>
            <td>${u.email || '<span style="color:#94A3B8;">Sin correo</span>'}</td>
            <td>${activeText}</td>
            <td style="display: flex; gap: 6px;">
              <button class="btn-action btn-reset" onclick="resetPassword(${u.id}, '${u.username}')">
                <i class="ri-key-line"></i> Restablecer
              </button>
              <button class="btn-action ${toggleBtnClass}" onclick="toggleUserActive(${u.id})">
                <i class="ri-shield-keyhole-line"></i> ${toggleBtnText}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleCreateUser(e) {
      e.preventDefault();
      const payload = {
        role: document.getElementById('new-role').value,
        username: document.getElementById('new-username').value.trim(),
        first_name: document.getElementById('new-firstname').value.trim(),
        last_name: document.getElementById('new-lastname').value.trim(),
        email: document.getElementById('new-email').value.trim(),
        password: document.getElementById('new-password').value.trim()
      };

      fetch(getApiUrl('/apiUserCreate/create_staff_user/'), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.username) {
          showToast(`¡Credencial creada! Usuario: ${data.username} | Clave: ${data.password}`, 'success', 8000);
          document.getElementById('create-user-form').reset();
          document.getElementById('create-modal').classList.remove('active');
          loadUsers();
        } else {
          showToast(data.error || 'Error al crear la credencial', 'error');
        }
      })
      .catch(err => {
        console.error(err);
        showToast('Error de servidor al guardar credencial', 'error');
      });
    }

    function toggleUserActive(userId) {
      fetch(getApiUrl('/apiUserCreate/toggle_user_active/'), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({ user_id: userId })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          showToast(data.message, 'info');
          loadUsers();
        } else {
          showToast(data.error || 'Error al cambiar estado', 'error');
        }
      });
    }

    function resetPassword(userId, username) {
      if (!confirm(`¿Desea restablecer la contraseña para el usuario "${username}"?`)) return;

      fetch(getApiUrl('/apiUserCreate/reset_user_password/'), {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({ user_id: userId })
      })
      .then(res => res.json())
      .then(data => {
        if (data.password) {
          showToast(`Nueva contraseña para ${username}: ${data.password}`, 'success', 10000);
        } else {
          showToast(data.error || 'Error al restablecer contraseña', 'error');
        }
      });
    }
  </script>
</body>
</html>
