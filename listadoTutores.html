<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Tutores — Colegio Enrique de Ossó</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css?v=1.4.0">
</head>
<body>
  <div class="background"></div>

  <!-- Barra de navegación -->
  <nav class="nav">
    <div class="nav__container">
      <button class="nav__button" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="nav__item">
      <span class="nav__title">Listado de Tutores</span>
    </div>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#" id="logout-link"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="layout__conteiner">
    <div class="layout">
      <div class="layout__image">
        <img src="./images/Tutor.png" alt="Tutores" style="position: sticky; top: 20px;">
      </div>

      <div class="steps-wrapper" style="flex: 1; max-width: 1050px; width: 100%;">
        <section class="layout__section" style="width: 100%; max-width: 1050px; margin: 0;">
          <div class="section">
            <div class="section__title" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <span>👨‍👩‍👧‍👦 Tutores / Responsables Registrados</span>
              <span style="font-size: 0.9rem; font-weight: normal; color: var(--slate-600);" id="tutor-count-badge">Cargando tutores...</span>
            </div>

            <!-- Buscador de Tutores -->
            <div style="margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
              <input type="text" id="search-tutor-input" class="form__control" placeholder="🔍 Buscar por Cédula, Nombre o Apellido..." style="max-width: 420px;">
              <button type="button" class="form__button--purple" id="btn-search-tutor" style="padding: 10px 20px; font-size: 0.9rem;">Buscar</button>
            </div>
            
            <!-- Mensaje de no tutores -->
            <div id="no-tutors-message" style="display: none; text-align: center; padding: 30px; color: var(--slate-600); font-weight: 500;">
              No se encontraron tutores registrados en el sistema.
            </div>

            <div class="table-responsive" id="table-tutors-wrapper">
              <table class="form__table" id="tutors-table">
                <thead>
                  <tr>
                    <th class="form__table-campo--header">Cédula / Código</th>
                    <th class="form__table-campo--header">Tutor / Responsable</th>
                    <th class="form__table-campo--header">N. Teléfono</th>
                    <th class="form__table-campo--header">Correo Electrónico</th>
                    <th class="form__table-campo--header">Dirección</th>
                    <th class="form__table-campo--header">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tutors-tbody">
                  <!-- Se rellena dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- MODAL: Editar Tutor -->
  <div class="modal__container" id="editTutorModal">
    <div class="modal" style="width: 500px;">
      <span class="modal__close" onclick="closeEditTutorModal()">&times;</span>
      <h2>Editar Información del Tutor</h2>
      <form id="edit-tutor-form" novalidate>
        <input type="hidden" id="modal_tutor_id">
        <div class="form__group">
          <label class="form__label" for="modal_code_tutor">Número de Identidad / Cédula</label>
          <input type="text" class="form__control" id="modal_code_tutor" required>
        </div>
        <div class="form__group mt-1">
          <label class="form__label" for="modal_name_tutor">Nombres</label>
          <input type="text" class="form__control" id="modal_name_tutor" required>
        </div>
        <div class="form__group mt-1">
          <label class="form__label" for="modal_surname_tutor">Apellidos</label>
          <input type="text" class="form__control" id="modal_surname_tutor" required>
        </div>
        <div class="form__group mt-1">
          <label class="form__label" for="modal_phone_tutor">Número de Teléfono</label>
          <input type="tel" class="form__control" id="modal_phone_tutor" required>
        </div>
        <div class="form__group mt-1">
          <label class="form__label" for="modal_email_tutor">Correo Electrónico</label>
          <input type="email" class="form__control" id="modal_email_tutor">
        </div>
        <div class="form__group mt-1">
          <label class="form__label" for="modal_address_tutor">Dirección de Domicilio</label>
          <input type="text" class="form__control" id="modal_address_tutor" required>
        </div>
        <div class="form__button mt-2">
          <button type="button" class="form__button--red" onclick="closeEditTutorModal()">Cancelar</button>
          <button type="submit" class="form__button--green" id="btn-save-tutor-modal">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/global.js?v=1.5.1"></script>
  <script src="js/Creados/Catalagos/listadoTutores.js?v=1.4.0"></script>
</body>
</html>
