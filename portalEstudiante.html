  <link rel="stylesheet" href="css/global.css?v=1.7.0">
  <style>
    :root {
      /* Hereda la marca global (Índigo & Ámbar) para mantener coherencia */
      --pe-primary: var(--primary, #4F46E5);
      --pe-primary-deep: var(--primary-dark, #3730A3);
      --pe-gold: var(--accent, #F59E0B);
      --pe-ink: var(--slate-800, #1E293B);
      --pe-muted: var(--slate-500, #64748B);
      --pe-card: var(--glass-bg, rgba(255, 255, 255, 0.78));
      --pe-excellent: #16a34a;
      --pe-good: #0ea5e9;
      --pe-ok: #14b8a6;
      --pe-warn: #f59e0b;
      --pe-risk: #ef4444;
    }

    body { background: radial-gradient(135deg, #F8FAFC 0%, #EEF2F6 100%); }

    /* ---------- Animated backdrop ---------- */
    .pe-bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background:
        radial-gradient(1100px 620px at 12% -8%, rgba(79,70,229,0.20), transparent 60%),
        radial-gradient(900px 520px at 108% 8%, rgba(245,158,11,0.16), transparent 55%),
        radial-gradient(760px 560px at 50% 118%, rgba(99,102,241,0.14), transparent 60%);
    }

    .pe-wrap { max-width: 1080px; margin: 0 auto; padding: 8px 18px 60px; }

    /* ---------- HERO ---------- */
    .pe-hero {
      position: relative; overflow: hidden;
      border-radius: 26px; padding: 34px 32px;
      color: #fff;
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 42%, #3730A3 100%);
      box-shadow: 0 22px 48px -18px rgba(55,48,163,0.6);
      animation: pe-rise 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pe-hero__blob {
      position: absolute; border-radius: 50%; filter: blur(6px); opacity: 0.5;
      pointer-events: none;
    }
    .pe-hero__blob--1 {
      width: 240px; height: 240px; right: -60px; top: -80px;
      background: radial-gradient(circle at 30% 30%, rgba(243,190,16,0.85), transparent 70%);
      animation: pe-float 9s ease-in-out infinite;
    }
    .pe-hero__blob--2 {
      width: 200px; height: 200px; left: -50px; bottom: -90px;
      background: radial-gradient(circle at 60% 40%, rgba(14,165,233,0.75), transparent 70%);
      animation: pe-float 11s ease-in-out infinite reverse;
    }
    .pe-hero__content { position: relative; z-index: 1; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .pe-avatar {
      flex: none; width: 88px; height: 88px; border-radius: 26px;
      display: grid; place-items: center;
      font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif);
      font-size: 2rem; font-weight: 800; letter-spacing: 0.5px;
      color: #fff; background: rgba(255,255,255,0.16);
      border: 1.5px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(6px);
      box-shadow: inset 0 0 22px rgba(255,255,255,0.12);
      animation: pe-pop 0.8s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pe-greeting { font-size: 0.98rem; opacity: 0.9; margin: 0 0 2px; font-weight: 500; }
    .pe-name {
      font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif);
      font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; margin: 0 0 12px; line-height: 1.1;
    }
    .pe-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pe-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28);
      padding: 5px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    }

    /* ---------- Overview: ring + stats ---------- */
    .pe-overview {
      display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 22px;
    }
    .pe-card {
      background: var(--pe-card); border: 1px solid rgba(79,70,229,0.10);
      border-radius: 22px; box-shadow: 0 14px 34px -22px rgba(55,48,163,0.5);
      backdrop-filter: blur(10px);
    }
    .pe-ringcard {
      padding: 26px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: pe-rise 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pe-ringcard__label { font-size: 0.82rem; color: var(--pe-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
    .pe-status { font-weight: 700; font-size: 0.95rem; }

    .pe-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .pe-stat {
      padding: 20px; display: flex; flex-direction: column; gap: 4px;
      animation: pe-rise 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pe-stat__icon { font-size: 1.5rem; }
    .pe-stat__value { font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif); font-size: 1.7rem; font-weight: 800; color: var(--pe-ink); line-height: 1; }
    .pe-stat__label { font-size: 0.8rem; color: var(--pe-muted); font-weight: 500; }

    /* ---------- Subjects ---------- */
    .pe-section-title {
      font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif);
      font-size: 1.25rem; font-weight: 800; color: var(--pe-ink);
      margin: 30px 4px 14px; display: flex; align-items: center; gap: 8px;
    }
    .pe-subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .pe-subject {
      padding: 18px; display: flex; gap: 16px; align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pe-rise 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pe-subject:hover { transform: translateY(-4px); box-shadow: 0 20px 38px -20px rgba(55,48,163,0.55); }
    .pe-subject__body { min-width: 0; flex: 1; }
    .pe-subject__name {
      font-weight: 700; color: var(--pe-ink); font-size: 0.98rem; margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pe-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; color: #fff;
    }
    .pe-dots { display: flex; gap: 6px; margin-top: 10px; }
    .pe-dot {
      width: 26px; height: 6px; border-radius: 999px; background: var(--slate-200, #E2E8F0);
    }
    .pe-dot--on { background: currentColor; }

    /* ---------- Ring (SVG) ---------- */
    .pe-ring { position: relative; width: 132px; height: 132px; }
    .pe-ring svg { transform: rotate(-90deg); }
    .pe-ring__track { fill: none; stroke: var(--slate-200, #E2E8F0); }
    .pe-ring__fill {
      fill: none; stroke-linecap: round;
      transition: stroke-dashoffset 1.1s cubic-bezier(0.22,1,0.36,1);
    }
    .pe-ring__center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .pe-ring__num { font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif); font-weight: 800; color: var(--pe-ink); }
    .pe-ring--sm { width: 74px; height: 74px; flex: none; }

    /* ---------- CTA ---------- */
    .pe-cta {
      display: inline-flex; align-items: center; gap: 10px; margin: 28px auto 0; text-decoration: none;
      background: linear-gradient(135deg, #4F46E5, #3730A3); color: #fff;
      padding: 14px 26px; border-radius: 14px; font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 16px 30px -14px rgba(61,36,112,0.7);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .pe-ctawrap { display: flex; justify-content: center; }
    .pe-cta:hover { transform: translateY(-3px); box-shadow: 0 22px 38px -14px rgba(61,36,112,0.8); }

    /* ---------- Loading skeleton ---------- */
    .pe-loading { margin-top: 22px; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .pe-skel {
      border-radius: 22px; background: linear-gradient(100deg, #eceaf5 30%, #f6f4fb 50%, #eceaf5 70%);
      background-size: 200% 100%; animation: pe-shimmer 1.3s infinite;
    }
    .pe-skel--ring { height: 210px; }
    .pe-skel--stats { height: 210px; }

    /* ---------- Message / locked ---------- */
    .pe-message { margin-top: 22px; text-align: center; padding: 46px 26px; }
    .pe-message__emoji { font-size: 3rem; }
    .pe-message__title { font-family: var(--font-heading, 'Plus Jakarta Sans', sans-serif); font-size: 1.3rem; font-weight: 800; color: var(--pe-ink); margin: 12px 0 6px; }
    .pe-message__text { color: var(--pe-muted); font-size: 0.95rem; line-height: 1.55; max-width: 460px; margin: 0 auto; }

    /* ---------- Keyframes ---------- */
    @keyframes pe-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pe-pop { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes pe-float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-16px, 20px); } }
    @keyframes pe-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (prefers-reduced-motion: reduce) {
      .pe-hero, .pe-ringcard, .pe-stat, .pe-subject, .pe-avatar { animation: none; }
      .pe-hero__blob { animation: none; }
      .pe-ring__fill { transition: none; }
    }

    /* ---------- Responsive ---------- */
    @media screen and (max-width: 820px) {
      .pe-overview, .pe-loading { grid-template-columns: 1fr; }
    }
    @media screen and (max-width: 480px) {
      .pe-stats { grid-template-columns: 1fr 1fr; }
      .pe-hero { padding: 26px 20px; }
      .pe-wrap { padding: 8px 12px 48px; }
    }
  </style>
</head>
<body>
  <div class="pe-bg"></div>

  <nav class="nav">
    <button class="nav__button" onclick="goBack()">

          clip-rule="evenodd" />
      </svg>
    </button>
    <span class="nav__title">Mi Portal</span>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>

  <div class="separador"></div>

  <main class="pe-wrap">
    <!-- HERO -->
    <section class="pe-hero">
      <div class="pe-hero__blob pe-hero__blob--1"></div>
      <div class="pe-hero__blob pe-hero__blob--2"></div>
      <div class="pe-hero__content">
        <div class="pe-avatar" id="pe-avatar">··</div>
        <div class="pe-hero__text">
          <p class="pe-greeting" id="pe-greeting">¡Hola!</p>
          <h1 class="pe-name" id="pe-name">Estudiante</h1>
          <div class="pe-chips" id="pe-chips"></div>
        </div>
      </div>
    </section>

    <!-- LOADING SKELETON -->
    <section id="pe-loading" class="pe-loading">
      <div class="pe-skel pe-skel--ring"></div>
      <div class="pe-skel pe-skel--stats"></div>
    </section>

    <!-- MESSAGE / LOCKED / ERROR -->
    <section id="pe-message" class="pe-card pe-message" style="display:none;"></section>

    <!--
      COMPLETAR DATOS
      Casi todas las fichas entraron por carga masiva desde los libros de
      notas: solo traen nombre y grupo. Quien mejor conoce el resto es el
      propio estudiante, así que se le pide aquí en vez de que administración
      persiga a 500 familias. Solo aparece si de verdad le falta algo.
    -->
    <section id="pe-datos" class="pe-card" style="display:none; margin-bottom:22px; border-left:4px solid var(--warning, #E9A23B);">
      <h2 class="pe-section-title" style="margin-top:0;">📝 Completar mis datos</h2>
      <p id="pe-datos-intro" style="font-size:0.9rem; color:var(--slate-600); margin:0 0 14px; line-height:1.5;"></p>
      <div id="pe-datos-campos" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;"></div>
      <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button type="button" class="pe-cta" id="pe-datos-guardar" style="border:none; cursor:pointer;">Guardar mis datos</button>
        <span id="pe-datos-estado" style="font-size:0.85rem; color:var(--slate-500);"></span>
      </div>
    </section>

    <!-- CONTENT -->
    <section id="pe-content" style="display:none;">
      <div class="pe-overview">
        <div class="pe-card pe-ringcard">
          <div class="pe-ring" id="pe-overall-ring"></div>
          <div class="pe-ringcard__label">Promedio general</div>
          <div class="pe-status" id="pe-overall-status"></div>
        </div>
        <div class="pe-stats" id="pe-stats"></div>
      </div>

      <h2 class="pe-section-title">📚 Mis asignaturas</h2>
      <div class="pe-subjects" id="pe-subjects"></div>

      <div class="pe-ctawrap">
        <a class="pe-cta" href="registroNotas.html">Ver boletín completo detallado →</a>
      </div>
    </section>
  </main>

  <script src="js/global.js?v=1.7.0"></script>
  <script src="js/scriptPortalEstudiante.js?v=1.3.0"></script>
  <script src="js/scriptCompletarDatos.js?v=1.0.0"></script>
