<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Completo de Estudiante — Colegio Enrique de Ossó</title>
  <link rel="stylesheet" href="css/global.css?v=1.4.2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css"
    integrity="sha384-2+8OcleUOxnP/2cYXK9FBoMe12ojS0iPrrJy9Um4ICFk2AXl8iODUaIoUKI6TmGj" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="background"></div>

  <nav class="nav">
    <div class="nav__container">
      <button class="nav__button" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="nav__item">
      <span class="nav__title">Registro de Estudiante</span>
    </div>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#" id="logout-link"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="layout__conteiner" style="max-width: 1000px; margin: 0 auto; padding: 1.5rem;">
    <div class="layout">
      <div class="layout__image">
        <img src="./images/Estudiante.png" alt="Estudiante" style="position: sticky; top: 20px;">
      </div>

      <section class="layout__section" style="flex:1;">
        <div class="section">
          <div class="section__title">Ficha Completa de Inscripción de Estudiante</div>
          <form class="form" id="form-validation" novalidate>
            <input type="hidden" id="student_id">

            <!-- DATOS PERSONALES -->
            <div style="font-weight:700; color:var(--primary-dark); margin-bottom:10px; border-bottom:1px solid var(--slate-200); padding-bottom:4px;">
              <i class="ri-user-smile-line"></i> Datos del Estudiante
            </div>
            
            <div class="form__grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
              <div class="form__group">
                <label class="form__label" for="code_student">Código de Estudiante</label>
                <input type="text" class="form__control" id="code_student" placeholder="Ej: EST-7A-01" required style="text-transform: uppercase; font-weight:700;">
              </div>

              <div class="form__group">
                <label class="form__label" for="first_name">Primer Nombre</label>
                <input type="text" class="form__control" id="first_name" placeholder="Primer Nombre" required>
              </div>

              <div class="form__group">
                <label class="form__label" for="second_name">Segundo Nombre</label>
                <input type="text" class="form__control" id="second_name" placeholder="Segundo Nombre">
              </div>

              <div class="form__group">
                <label class="form__label" for="first_lastname">Primer Apellido</label>
                <input type="text" class="form__control" id="first_lastname" placeholder="Primer Apellido" required>
              </div>

              <div class="form__group">
                <label class="form__label" for="second_lastname">Segundo Apellido</label>
                <input type="text" class="form__control" id="second_lastname" placeholder="Segundo Apellido">
              </div>

              <div class="form__group">
                <label class="form__label" for="birthday_student">Fecha de Nacimiento</label>
                <input type="date" class="form__control" id="birthday_student">
              </div>

              <div class="form__group">
                <label class="form__label" for="gender">Sexo</label>
                <select class="form__control" id="gender">
                  <option value="M">Masculino (M)</option>
                  <option value="F">Femenino (F)</option>
                </select>
              </div>

              <div class="form__group">
                <label class="form__label" for="nationality">Nacionalidad</label>
                <input type="text" class="form__control" id="nationality" value="Nicaragüense">
              </div>

              <div class="form__group">
                <label class="form__label" for="religion">Religión</label>
                <input type="text" class="form__control" id="religion" placeholder="Ej: Católica, Cristiana">
              </div>

              <div class="form__group">
                <label class="form__label" for="group_id">Grupo Académico Asignado</label>
                <select class="form__control" id="group_id" style="font-weight:600;">
                  <option value="">Seleccione el Grupo</option>
                </select>
              </div>
            </div>

            <!-- SALUD Y DOMICILIO -->
            <div style="font-weight:700; color:var(--primary-dark); margin:15px 0 10px 0; border-bottom:1px solid var(--slate-200); padding-bottom:4px;">
              <i class="ri-health-book-line"></i> Salud y Domicilio
            </div>

            <div class="form__grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
              <div class="form__group">
                <label class="form__label" for="weight">Peso (lbs / kg)</label>
                <input type="text" class="form__control" id="weight" placeholder="Ej: 60 lbs">
              </div>

              <div class="form__group">
                <label class="form__label" for="height">Talla / Estatura (cm)</label>
                <input type="text" class="form__control" id="height" placeholder="Ej: 156 cm">
              </div>

              <div class="form__group" style="grid-column: span 2;">
                <label class="form__label" for="health_condition">Diagnóstico de Salud / Alergias</label>
                <input type="text" class="form__control" id="health_condition" value="NINGUNO" placeholder="Ej: Asma, NINGUNO">
              </div>

              <div class="form__group" style="grid-column: span 2;">
                <label class="form__label" for="address">Domicilio de Residencia</label>
                <textarea class="form__control" id="address" rows="2" placeholder="Dirección exacta de residencia"></textarea>
              </div>

              <div class="form__group" style="grid-column: span 2;">
                <label class="form__label" for="siblings_info">Hermanos en el Colegio</label>
                <input type="text" class="form__control" id="siblings_info" placeholder="Ej. Nombre y Grado del hermano(a)">
              </div>
            </div>

            <!-- BOTONES -->
            <div class="form__button" style="margin-top: 1.5rem; display:flex; gap:12px;">
              <button id="register-btn" type="submit" class="form__button--green"><i class="ri-save-line"></i> Guardar Estudiante</button>
              <button type="button" class="form__button--purple" onclick="location.href='listadoEstudiantes.html'"><i class="ri-file-list-line"></i> Ver Listado General</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script src="js/global.js?v=1.4.2"></script>
  <script src="./js/Creados/Catalagos/indexEstudiante.js?v=1.4.2"></script>
</body>
</html>
