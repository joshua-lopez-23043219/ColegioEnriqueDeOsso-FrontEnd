<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro y Asignación de Grupo — Colegio Enrique de Ossó</title>
  <link rel="stylesheet" href="css/global.css?v=1.4.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css"
    integrity="sha384-2+8OcleUOxnP/2cYXK9FBoMe12ojS0iPrrJy9Um4ICFk2AXl8iODUaIoUKI6TmGj" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .groups-table-container {
      margin-top: 2rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      overflow-x: auto;
    }
    .groups-table {
      width: 100%;
      border-collapse: collapse;
    }
    .groups-table th, .groups-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--slate-200);
      font-size: 0.9rem;
    }
    .groups-table th {
      background: var(--slate-100);
      font-weight: 700;
      color: var(--slate-800);
    }
    .badge-guide {
      background: #E0E7FF;
      color: #3730A3;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <nav class="nav">
    <div class="nav__container">
      <button class="nav__button" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="nav__item">
      <span class="nav__title">Registro de Grupo y Maestro Guía</span>
    </div>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#" id="logout-link"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="layout__conteiner" style="max-width: 1100px; margin: 0 auto; padding: 1.5rem;">
    <div class="layout">
      <div class="layout__image">
        <img src="./images/Grupo.png" alt="imagen">
      </div>

      <section class="layout__section">
        <div class="section">
          <div class="section__title">Configuración de Grupo y Maestro Guía</div>
          <form class="form" id="form-validation" novalidate>
            <input type="hidden" id="editing_group_id">
            
            <div class="form__grid">
              <div class="form__group">
                <label class="form__label" for="level_group">Año / Grado Académico</label>
                <select class="form__control" id="level_group" required onchange="updateGroupCode()">
                  <option value="" disabled selected>Seleccione el Grado</option>
                  <option value="7mo">7mo Grado</option>
                  <option value="8vo">8vo Grado</option>
                  <option value="9no">9no Grado</option>
                  <option value="10mo">10mo Grado</option>
                  <option value="11mo">11mo Grado</option>
                </select>
              </div>

              <div class="form__group">
                <label class="form__label" for="section_group">Sección</label>
                <select class="form__control" id="section_group" required onchange="updateGroupCode()">
                  <option value="" disabled selected>Seleccione la Sección</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                </select>
              </div>

              <div class="form__group">
                <label class="form__label" for="classroom">Aula de Clase</label>
                <input type="text" class="form__control" id="classroom" placeholder="Ej: F1, F2, B1, C-3, D-1" required oninput="updateGroupCode()">
              </div>

              <div class="form__group">
                <label class="form__label" for="code_group">Código de Grupo (Grado-Letra-Aula)</label>
                <input type="text" class="form__control" id="code_group" placeholder="Ej: 7mo-A-F1" required readonly style="background: var(--slate-100); font-weight:700; color:var(--primary-dark);">
              </div>

              <div class="form__group" style="grid-column: span 2;">
                <label class="form__label" for="guide_teacher">Maestro Guía Asignado</label>
                <select class="form__control" id="guide_teacher" required style="font-weight: 600;">
                  <option value="">Cargando docentes disponibles...</option>
                </select>
              </div>

              <div class="form__group">
                <label class="form__label" for="amount_group">Capacidad Máxima de Alumnos</label>
                <select class="form__control" id="amount_group" required>
                  <option value="35" selected>35 Alumnos</option>
                  <option value="30">30 Alumnos</option>
                  <option value="40">40 Alumnos</option>
                </select>
              </div>

              <div class="form__group">
                <label class="form__label" for="turno">Turno</label>
                <select class="form__control" id="turno" required>
                  <option value="Matutino" selected>Matutino</option>
                  <option value="Vespertino">Vespertino</option>
                </select>
              </div>
            </div>

            <div class="form__button" style="margin-top: 1.5rem; display:flex; gap:1rem;">
              <button type="button" class="form__button--green" onclick="guardargrupo(event)"><i class="ri-save-line"></i> Guardar Grupo</button>
              <button type="button" class="form__button--purple" onclick="cancelarEdicion()"><i class="ri-refresh-line"></i> Limpiar Formulario</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <!-- Tabla de Grupos Registrados -->
    <div class="groups-table-container">
      <h3 style="margin-bottom: 1rem; color: var(--primary-dark); font-size: 1.15rem; display:flex; align-items:center; gap:8px;">
        <i class="ri-group-line"></i> Grupos y Maestros Guías Configurados
      </h3>
      <table class="groups-table">
        <thead>
          <tr>
            <th>Código (Grado-Letra-Aula)</th>
            <th>Grado y Sección</th>
            <th>Aula</th>
            <th>Maestro Guía Asignado</th>
            <th>Capacidad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="groups-tbody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--slate-500); padding: 1.5rem;">Cargando grupos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/global.js?v=1.5.0"></script>
  <script src="js/scriptGrupo.js?v=1.5.0"></script>
</body>
</html>
