<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app; connect-src 'self' https://colegioenriquedeosso-backend-production.up.railway.app https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://colegioenriquedeosso-backend-production.up.railway.app; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Maestro — Colegio Enrique de Ossó</title>
  <link rel="stylesheet" href="css/global.css?v=1.0.8">
  <style>
    /* Filas repetibles de área/asignatura */
    .area-fila {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .area-fila .form__control {
      flex: 1;
      margin: 0;
    }
    .btn-quitar-area {
      background: transparent;
      border: 1px solid var(--slate-200);
      color: var(--danger);
      border-radius: var(--radius-sm);
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      transition: all var(--transition-fast);
    }
    .btn-quitar-area:hover {
      background: rgba(231, 76, 60, 0.1);
      border-color: rgba(231, 76, 60, 0.3);
    }
    .btn-quitar-area:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-agregar-area {
      margin-top: 4px;
      background: rgba(93, 60, 166, 0.08);
      border: 1px dashed rgba(93, 60, 166, 0.35);
      color: var(--primary-dark);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-agregar-area:hover {
      background: rgba(93, 60, 166, 0.15);
      border-style: solid;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <nav class="nav">
    <div class="nav__container">
      <button class="nav__button" onclick="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="nav__button-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="nav__item">
      <span class="nav__title">Maestro</span>
    </div>
    <div class="nav__profile">
      <img src="./images/usuario.png" class="nav__profile-img">
      <ul class="nav__profile-link">
        <li><a href="ayuda.html"><img src="./images/help.png" class="nav__profile-img">Ayuda</a></li>
        <li><a href="#"><img src="./images/close.png" class="nav__profile-img">Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
  <div class="separador"></div>

  <div class="layout__conteiner">
    <div class="layout">
      <div class="layout__image">
        <img src="./images/docente.png" alt="imagen">
      </div>

      <section class="layout__section">
        <div class="section">
          <div class="section__title">Registro de Maestro</div>
          <form class="form" id="form-validation" novalidate>
            <div class="form__grid">
              <div class="form__group">
                <label class="form__label" for="Nmaestro">N° de Cédula</label>
                <input type="text" class="form__control" id="Nmaestro" name="Nmaestro"
                  placeholder="Ingrese el N.Identidad" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="nombres">Nombres</label>
                <input type="text" class="form__control" id="nombres" name="nombre_maestro"
                  placeholder="Ingrese Nombre" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="apellidos">Apellidos</label>
                <input type="text" class="form__control" id="apellidos" name="apellidos_maestro"
                  placeholder="Ingrese Apellidos" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="direccion">Dirección</label>
                <input type="text" class="form__control" id="direccion" name="direccion"
                  placeholder="Ingrese Dirección" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="telefono">N.Teléfono</label>
                <input type="tel" class="form__control" id="telefono" name="telefono"
                  placeholder="Ingrese Numero de Teléfono" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="email">Correo Electrónico</label>
                <input type="email" class="form__control" id="email" name="email"
                  placeholder="Ingrese el Email" required>
              </div>
              <input type="hidden" id="id_teacher">

              <!-- Áreas / asignaturas del docente.
                   Un mismo maestro puede impartir más de una (p. ej. Marta
                   Herrera da Química y Biología, Fanni Casco da Matemática y
                   Aprender-Emprender-Prosperar), así que el campo es
                   repetible: "Agregar materia" añade otra fila. -->
              <div class="form__group" style="grid-column: span 2;">
                <label class="form__label" for="asignatura">Área(s) o Asignatura(s)</label>
                <div id="areas-container"></div>
                <button type="button" class="btn-agregar-area" id="btn-add-area">
                  ➕ Agregar materia
                </button>
                <small style="display:block; margin-top:6px; color:var(--gray-600); font-size:0.8rem;">
                  Agregue una fila por cada asignatura que imparte. Esto queda ligado al docente y el sistema lo usa para validar el horario.
                </small>
              </div>
            </div>
            <div class="form__button">
              <button type="submit" class="form__button--green" onclick="guardarmaestro(event)">
                Guardar
              </button>
              <button type="submit" class="form__button--purple" onclick="editarmaestro(event)">
                Editar
              </button>
              <button type="submit" class="form__button--red" onclick="eliminarmaestro(event)">
                Eliminar
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script src="js/global.js?v=1.5.0"></script>
  <script src="js/scriptMaestro.js?v=1.3.0"></script>
</body>
</html>
